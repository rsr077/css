<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
 .search-button:hover .tooltip,
.voice-search-button:hover .tooltip,
.upload-icon-container:hover .tooltip {
  opacity: 1;
}


.search-button .tooltip,
.voice-search-button .tooltip ,
.upload-icon-container .tooltip{
  font-family: Arial;
  position: absolute;
  background-color: gray;
  color: white;
  padding: 4px 8px;
  border-radius: 2px;
  font-size: 12px;
  opacity: 0;
  transition: opacity 0.15s;
  pointer-events: none;
  white-space: nowrap;
margin-left: 400px;

}

.voice-search-icon{
  width: 30px;
}

.toll {
  height: 100px;
}
  </style>
</head>
<body>
  <button class="voice-search-button"> <img class="voice-search-icon" src="rebirth.webp"> <div class="tooltip">
     <img class="toll" src="rebirth.webp" alt="">  </div></button>
</body>
</html>
